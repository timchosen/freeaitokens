# Builds the tray app on each OS and attaches it to a draft GitHub release. Run by pushing a tag like desktop-v0.1.0.
name: desktop
on:
  push:
    tags: ['desktop-v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: npm ci && npm test && npm run build
      - run: npm ci
        working-directory: desktop
      # The universal Mac app needs the keychain module for both chips; npm only installs the runner's.
      - if: runner.os == 'macOS'
        run: npm install --no-save --force @napi-rs/keyring-darwin-x64@2.1.2 @napi-rs/keyring-darwin-arm64@2.1.2
        working-directory: desktop
      # With an Apple Developer ID in the repo secrets, the Mac app is signed and notarized, so macOS
      # opens it with no warning. Without them it stays ad-hoc signed, as before.
      - if: runner.os == 'macOS' && env.MAC_CERT != ''
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));delete p.build.mac.identity;Object.assign(p.build.mac,{hardenedRuntime:true,notarize:true});fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
        working-directory: desktop
        env:
          MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
      - run: npx electron-builder --publish always
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Mac only, so Windows never tries to sign with the Apple certificate.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
