# Builds the tray app on each OS and attaches it to a draft GitHub release. Run by pushing a tag like desktop-v0.1.0.
name: desktop
on:
  push:
    tags: ['desktop-v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: npm ci && npm test && npm run build
      - run: npm ci
        working-directory: desktop
      # The universal Mac app needs the keychain module for both chips; npm only installs the runner's.
      - if: runner.os == 'macOS'
        run: npm install --no-save --force @napi-rs/keyring-darwin-x64@2.1.2 @napi-rs/keyring-darwin-arm64@2.1.2
        working-directory: desktop
      - run: npx electron-builder --publish always
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
