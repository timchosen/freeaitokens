# Builds the tray app on each OS and attaches it to a draft GitHub release. Run by pushing a tag like desktop-v0.1.0.
name: desktop
on:
  push:
    tags: ['desktop-v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }} # true/false only; the certificate itself stays in the signing step
      HAS_WIN_SIGN: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      # Desktop modules the tests load (unpdf) need desktop's packages; scripts skipped, Electron comes with the install below.
      - run: npm ci && npm ci --prefix desktop --ignore-scripts && npm test && npm run build
      - run: npm ci
        working-directory: desktop
      # The universal Mac app needs the keychain module for both chips; npm only installs the runner's.
      - if: runner.os == 'macOS'
        run: npm install --no-save --force @napi-rs/keyring-darwin-x64@2.1.2 @napi-rs/keyring-darwin-arm64@2.1.2
        working-directory: desktop
      # With an Apple Developer ID in the repo secrets, the Mac app is signed and notarized, so macOS
      # opens it with no warning. Without them nothing is set and it stays ad-hoc signed, as before.
      - if: runner.os == 'macOS' && env.HAS_MAC_CERT == 'true'
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));delete p.build.mac.identity;Object.assign(p.build.mac,{hardenedRuntime:true,notarize:true});fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
          {
            echo "CSC_LINK=$MAC_CERT"
            echo "CSC_KEY_PASSWORD=$MAC_CERT_PASSWORD"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
        working-directory: desktop
        env:
          MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # With Azure Trusted Signing in the repo secrets, the Windows installer and app are signed, so
      # SmartScreen names the publisher instead of "Unknown publisher". Without them it stays unsigned, as before.
      - if: runner.os == 'Windows' && env.HAS_WIN_SIGN == 'true'
        shell: bash
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));const e=process.env;p.build.win.azureSignOptions={publisherName:e.WIN_PUBLISHER,endpoint:e.WIN_ENDPOINT,codeSigningAccountName:e.WIN_ACCOUNT,certificateProfileName:e.WIN_PROFILE};fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
          {
            echo "AZURE_TENANT_ID=$AZ_TENANT"
            echo "AZURE_CLIENT_ID=$AZ_CLIENT"
            echo "AZURE_CLIENT_SECRET=$AZ_SECRET"
          } >> "$GITHUB_ENV"
        working-directory: desktop
        env:
          WIN_PUBLISHER: ${{ secrets.WIN_PUBLISHER_NAME }}
          WIN_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          WIN_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          WIN_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          AZ_TENANT: ${{ secrets.AZURE_TENANT_ID }}
          AZ_CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
          AZ_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - run: npx electron-builder --publish always
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
