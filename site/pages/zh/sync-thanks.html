<div class="page">
  <h1>谢谢,同步已开通</h1>
  <p class="lead">回到 FreeAITokens。如果你是从应用里开始的,它会自己取回密钥,并请你设定口令。</p>

  <h2>在本网站购买的?</h2>
  <ol>
    <li>用付款邮箱,通过<a href="/sync#key">把密钥发给我</a>表单获取密钥。</li>
    <li>在 FreeAITokens 应用里打开 设置 › 同步,选择“我已经有密钥”。</li>
    <li>输入密钥并设定口令。保存显示的恢复码。</li>
  </ol>
  <p class="small muted">密钥的样子是 <code>FAT-XXXXX-XXXXX-XXXXX-XXXXX-XXXXX</code>。请保存好:每台电脑都需要它。</p>
</div>
